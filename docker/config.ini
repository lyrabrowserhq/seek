[server]
host = 0.0.0.0
port = 5000
domain = https://seek.lyrabrowser.com
# Behind TLS (Coolify, etc.): set max-age to always send HSTS if the proxy does not send X-Forwarded-Proto
# hsts_max_age_sec = 31536000
# hsts_include_subdomains = 1

[proxy]
# Mullvad SOCKS5 inside a WireGuard tunnel:
# SEEK_MULLVAD=1
# SEEK_PROXY=socks5h://10.64.0.1:1080
# SEEK_NOPROXY=localhost,127.0.0.1,::1,lyra-index,lyra-seek

[cache]
dir = /tmp/seeker_cache
ttl_search = 3600
ttl_infobox = 86400

[engines]
engines="lyra,ddg,brave,wikipedia,archwiki,debianwiki,mojeek,wiby,mwmbl,hn,stackoverflow"
default_engine = all
index_url = https://index.lyrabrowser.com

[rate_limit]
search_requests = 45
search_interval = 10
images_requests = 80
images_interval = 10
news_requests = 40
news_interval = 10
