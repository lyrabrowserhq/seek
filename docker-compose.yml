services:
  seeker:
    build:
      context: .
      dockerfile: Dockerfile
    image: seeker:latest
    container_name: seeker
    ports:
      - "${SEEKER_PORT:-5000}:5000"
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
