name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libcurl4-openssl-dev libxml2-dev \
            libssl-dev zlib1g-dev pkg-config

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Build ASan binary
        run: make asan

      - name: ASan smoke test
        run: |
          cp example-config.ini /tmp/seeker-ci.ini
          sed -i 's/port = .*/port = 18899/' /tmp/seeker-ci.ini
          sed -i 's|dir = .*|dir = /tmp/seeker_ci_cache|' /tmp/seeker-ci.ini
          ./bin/seeker-asan --config /tmp/seeker-ci.ini &
          SRV=$!
          sleep 2
          for p in / /news "/news?format=json" /settings /bangs /opensearch.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://127.0.0.1:18899$p")
            echo "$p -> $code"
            test "$code" = "200" || exit 1
          done
          kill "$SRV" 2>/dev/null || true
