[server]
host = 0.0.0.0
port = 8087
domain = https://seek.lyrabrowser.com

[proxy]
# Mullvad WireGuard SOCKS5 (only reachable inside the tunnel):
# SEEK_MULLVAD=1 or:
#proxy = "socks5h://10.64.0.1:1080"
# SEEK_PROXY, SEEK_PROXY_LIST, SEEK_NOPROXY override these.

# Or use a proxy list file (one proxy per line)
#list_file = proxies.txt

#max_retries = 3

# Randomize proxy credentials for each request
#randomize_username = true
#randomize_password = true

[cache]
# Directory to store cached responses
#dir = /tmp/seeker_cache

# Cache TTL for search results in seconds (1 hour)
ttl_search = 3600

# Cache TTL for infobox data in seconds (24 hours)
ttl_infobox = 86400

# Cache TTL for image search results in seconds (7 days)
ttl_image = 604800

[engines]
# Use * for all engines, or specify comma-separated list
# Builtin: lyra, ddg, brave, yahoo, startpage, wikipedia, wiktionary,
# archwiki, debianwiki, nixos, gentoo, mediawiki, wikibooks, wikiquote,
# mwmbl, hn, reddit, lobsters, lemmy, stackoverflow, qwant, mojeek, wiby, yacy
engines="lyra,ddg,brave,wikipedia,archwiki,debianwiki,mojeek,wiby,mwmbl,hn,stackoverflow"
# Default engine used when a search does not specify one (engine id, or "all")
default_engine = all
# Lyra index API (RSS search). Default: https://index.lyrabrowser.com
#index_url = https://index.lyrabrowser.com
# YaCy instance for the yacy engine (default: http://127.0.0.1:8090)
# Requires "yacy" in the engines list, e.g. engines="*,yacy"
#yacy_instance = http://127.0.0.1:8090

[rate_limit]
# Per-client request limits (requests per interval seconds). 0 disables.
# /search
#search_requests = 10
#search_interval = 60
# /images
#images_requests = 20
#images_interval = 60
# /news
#news_requests = 20
#news_interval = 60

[operations]
# Optional: override bang URLs (must contain %s). See Bangs.c defaults for built-in triggers.
#bangs_file = /etc/seeker/bangs.ini
#http_timeout_sec = 15
#http_connect_timeout_sec = 10
#max_concurrent_fetches = 4
#cache_stampede_wait_ms = 50
#cache_stampede_max_attempts = 24
#retry_backoff_ms = 200

# Worker threads for handling HTTP requests (0 = auto, cores*2)
#worker_threads = 8
